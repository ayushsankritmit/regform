<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Registration</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    h2 { text-align: center; }
    form, #ticket {
      background: #fff; padding: 20px; border-radius: 8px;
      max-width: 400px; margin: 20px auto; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    label { display: block; margin-top: 10px; }
    input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 15px; padding: 10px; width: 100%; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    #ticket { display: none; text-align: center; }
    .ticket-info { text-align: left; margin: 10px 0; }
    .ticket-id { margin-top: 20px; font-weight: bold; color: #007bff; }
  </style>
</head>
<body>

  <h2>Event Registration</h2>
  <form id="registrationForm">
    <label>Name:</label>
    <input type="text" id="name" required>
    <label>Email:</label>
    <input type="email" id="email" required>
    <label>Phone:</label>
    <input type="text" id="phone" required>
    <button type="submit">Register</button>
  </form>

  <div id="ticket">
    <h3>🎟️ Your Event Ticket</h3>
    <div class="ticket-info"><strong>Name:</strong> <span id="tName"></span></div>
    <div class="ticket-info"><strong>Email:</strong> <span id="tEmail"></span></div>
    <div class="ticket-info"><strong>Phone:</strong> <span id="tPhone"></span></div>
    <div class="ticket-id">Ticket ID: <span id="tId"></span></div>
  </div>

  <!-- EmailJS SDK -->
  <script src="https://cdn.emailjs.com/sdk/3.2.0/email.min.js"></script>
  <script>
    (function(){
      emailjs.init("yfzitb1dTkGRLmB6o"); // Replace with your EmailJS public key
    })();

    document.getElementById("registrationForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;
      const ticketId = "TCK-" + Math.floor(Math.random() * 1000000);

      // Show ticket on page
      document.getElementById("tName").textContent = name;
      document.getElementById("tEmail").textContent = email;
      document.getElementById("tPhone").textContent = phone;
      document.getElementById("tId").textContent = ticketId;
      document.getElementById("ticket").style.display = "block";

      // Send email via EmailJS
      emailjs.send("service_ehrmxwg", "template_izq6x94", {
        to_name: name,
        to_email: email,
        phone: phone,
        ticket_id: ticketId
      }).then(function(response) {
        alert("✅ Ticket sent to " + email);
      }, function(error) {
        alert("❌ Failed to send ticket: " + JSON.stringify(error));
      });
    });
  </script>

</body>
</html>
